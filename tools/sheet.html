<!doctype html><html><body style="background:#3a7d3c;margin:0">
<canvas id="c" style="image-rendering:pixelated"></canvas>
<script type="module">
// every pose (columns) of every view (rows: side, front-diagonal, front, back-diagonal, back) per look
import { sheetPreview, CELL_W as CW, CELL_H as CH, SS, FRAME_COUNT, VIEW_COUNT } from '/src/pixel/player.ts';
const CELL_W = CW * SS, CELL_H = CH * SS;
import { TEAMS } from '/src/game/teams.ts';
const looks = [
  { kit: TEAMS[0], isGK: false, skin: '#e5b48f', hair: '#3b2416', hairStyle: 0, beard: false },
  { kit: TEAMS[1], isGK: false, skin: '#7a4d30', hair: '#1a1310', hairStyle: 2, beard: true },
  { kit: TEAMS[2], isGK: false, skin: '#f3d2b5', hair: '#e8d27a', hairStyle: 6, beard: false },
  { kit: TEAMS[3], isGK: true, skin: '#c98d63', hair: '#b02a1a', hairStyle: 3, beard: false },
];
const q = new URLSearchParams(location.search);
const S = +(q.get('s') || 3), only = q.get('look');
const list = only !== null ? [looks[+only]] : looks;
const c = document.getElementById('c');
c.width = CELL_W * FRAME_COUNT; c.height = CELL_H * VIEW_COUNT * list.length;
c.style.width = c.width * S + 'px';
const g = c.getContext('2d');
list.forEach((l, i) => g.drawImage(sheetPreview(l), 0, i * CELL_H * VIEW_COUNT));
g.fillStyle = 'rgba(0,0,0,.25)'; for (let y = 0; y < VIEW_COUNT * list.length; y++) g.fillRect(0, y * CELL_H + 35 * SS, c.width, 1);
document.title = 'ok';
</script></body></html>
