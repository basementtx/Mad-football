# Builds the Android APK (Capacitor) and publishes it as a GitHub Release,
# so it can be downloaded and installed straight from the phone.
#
# Stable download link: https://github.com/basementtx/Mad-football/releases/latest/download/MadFootball.apk
#
# Signing: if the repo secret ANDROID_KEYSTORE_BASE64 is set ("<password>:<base64 keystore>",
# or plain base64 + ANDROID_KEYSTORE_PASSWORD, alias ANDROID_KEY_ALIAS default "madfootball")
# the APK is re-signed with that key; otherwise it keeps the fixed debug key committed in
# android/app. Either way every build is signed with the same key, so updates install in place.
name: Android APK

on:
  push:
    branches: ['main', 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build the web game
        run: |
          npm ci
          VITE_BUILD=${{ github.run_number }} npm run build
          npx cap sync android

      - name: Build the APK
        working-directory: android
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p out
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            case "$KS_B64" in
              *:*) KS_PASS="${KS_B64%%:*}"; KS_B64="${KS_B64#*:}" ;;
              *) KS_PASS="$KS_PASS_SECRET" ;;
            esac
            KS_ALIAS="${KS_ALIAS_SECRET:-madfootball}"
            echo "$KS_B64" | tr -d ' \r\n' | base64 -d > ks.jks
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --out out/MadFootball.apk aligned.apk
            rm ks.jks
            echo "Signed with the repository release key"
          else
            cp "$APK" out/MadFootball.apk
            echo "Signed with the committed debug key"
          fi
          "$BT/apksigner" verify out/MadFootball.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MadFootball-build-${{ github.run_number }}
          path: out/MadFootball.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mad Football build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: out/MadFootball.apk
          body: |
            Android build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Telefonda **MadFootball.apk** dosyasını indirip açarak kurun (tarayıcı için "bilinmeyen uygulamaları yükle" izni istenebilir).
            Download **MadFootball.apk** on your phone and open it to install.
